apiVersion: v1
kind: ResourceQuota
metadata:
  name: devops-ai-quota
  namespace: devops-ai
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    persistentvolumeclaims: "10"
    services.loadbalancers: "2"
    count/deployments.apps: "10"
    count/services: "10"
    count/configmaps: "20"
    count/secrets: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: devops-ai-limit-range
  namespace: devops-ai
spec:
  limits:
    - max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      type: Container
    - max:
        cpu: "8"
        memory: 16Gi
      min:
        cpu: 200m
        memory: 256Mi
      type: Pod