apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-ai-agent-green
  labels:
    app.kubernetes.io/name: devops-ai-agent
    app.kubernetes.io/version: "1.1.0"
    deployment-color: green
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-ai-agent
      deployment-color: green
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-ai-agent
        deployment-color: green
        version: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: devops-ai-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - devops-ai-agent
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role
                    operator: In
                    values:
                      - production
      containers:
        - name: devops-ai-agent
          image: your-registry/devops-ai-agent:1.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
            - name: metrics
              containerPort: 8000
              protocol: TCP
          env:
            - name: DEPLOYMENT_COLOR
              value: "green"
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: devops-ai-config
            - secretRef:
                name: devops-ai-secrets
                optional: true
          resources:
            requests:
              memory: "1